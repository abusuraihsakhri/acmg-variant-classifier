name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run Test Suite
      run: |
        pytest -v

    - name: Verify CLI Smoke Test
      run: |
        python cli.py --help
        python cli.py --evidence PVS1 PS3 PM2 --json
        python cli.py --splice --pos 1 --ref G --alt A --json
        python cli.py --pgx --gene CYP2C19 --json
        python cli.py --domain --gene TP53 --pos 175 --json
        python cli.py -i sample_variants.csv --format json
        python cli.py -i sample_variants.csv --format csv
        acmg-classifier --evidence PVS1 PS3 PM2 --json
        python -m acmg_classifier --help
